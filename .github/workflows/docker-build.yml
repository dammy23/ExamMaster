name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/exam-master:latest .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/exam-master:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/exam-master:latest"
            CONTAINER="exam-master"
            ENVFILE"${{ secrets.ENV_FILE }}"
            PORT="${{ secrets.SERVER_PORT }}"

            echo "Ensuring Docker is installed..."
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi

            echo "Logging into Docker Hub (if needed)..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || true

            echo "Pulling latest image..."
            docker pull "$IMAGE"

            echo "Stopping and removing old container (if any)..."
            if [ "$(docker ps -aq -f name=$CONTAINER)" ]; then
              docker rm -f "$CONTAINER" || true
            fi

            echo "Starting new container using existing env file..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p $PORT:3000 \
              --env-file $ENVFILE \
              "$IMAGE"

            echo "Deployment complete!"

